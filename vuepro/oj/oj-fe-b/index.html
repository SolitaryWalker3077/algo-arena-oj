<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <!--<link rel="icon" href="/favicon.ico"> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
    <script>
      // 防主题闪烁（FOUC）：在首帧渲染前同步读取持久化偏好并写入 html.dark。
      // 存储键必须与 src/utils/theme.js 的 THEME_STORAGE_KEY 保持一致。
      (function () {
        try {
          var mode = localStorage.getItem('admin-theme-mode') || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || ((mode === 'system' || ['light', 'dark', 'system'].indexOf(mode) === -1) && prefersDark);
          var root = document.documentElement;
          if (isDark) root.classList.add('dark');
          root.style.colorScheme = isDark ? 'dark' : 'light';
          root.style.background = isDark ? '#141414' : '#f5f7fa';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
